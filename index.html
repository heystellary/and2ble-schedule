<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AND2BLE Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"><style>
:root{--bg:#f3f1e7;--paper:#fbfaf5;--ink:#22251e;--muted:#7a7c70;--line:#deddd1;--artist:#596b3d;--artist-soft:#e3e8d7;--fan:#d9df82;--fan-soft:#f0f1c9;--accent:#a9b84e;--tag-music-bg:#dfe8d2;--tag-music-fg:#40552f;--tag-prerec-bg:#d9e4b4;--tag-prerec-fg:#4e5d22;--tag-fansign-bg:#eee6b7;--tag-fansign-fg:#6b5b21;--tag-performance-bg:#d8dfd2;--tag-performance-fg:#3e5140;--tag-lucky-bg:#eef0a8;--tag-lucky-fg:#62651d;--tag-merch-bg:#e6dfc9;--tag-merch-fg:#675d42;--tag-ticket-bg:#e3e8c8;--tag-ticket-fg:#53602f;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 72px}header{padding:6px 2px 18px}h1{text-align:center;font-family:"Anton","Arial Narrow",Impact,sans-serif;font-size:31px;font-style:normal;font-weight:400;letter-spacing:.01em;line-height:1.05;margin:0}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.artist-dot{background:var(--artist)}.fan-dot{background:var(--fan)}
.navigator{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.025)}.navtop{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:34px;margin-bottom:12px}.range{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:720;line-height:34px;white-space:nowrap}.nav-actions{display:flex;align-items:center;gap:6px;margin-left:auto}.iconbtn{display:inline-flex;align-items:center;justify-content:center;height:34px;min-width:34px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:0 9px;font-size:12px;line-height:1;cursor:pointer}.iconbtn.active{background:var(--artist);border-color:var(--artist);color:white}.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.daybtn{border:0;background:transparent;border-radius:13px;padding:7px 2px 6px;min-width:0;cursor:pointer;color:var(--ink)}.daybtn .dow{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.daybtn .num{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;margin:auto;font-size:13px;font-weight:650}.daybtn.selected .num{background:var(--artist);color:#fff}.daybtn.today:not(.selected) .num{box-shadow:inset 0 0 0 1.5px var(--artist)}.daybtn.past{opacity:.38}.daybtn.past .dow,.daybtn.past .num{color:#8f8f8f}.daybtn.past.selected{opacity:1}.marks{height:9px;display:flex;justify-content:center;align-items:center;gap:3px;margin-top:4px}.marks .dot{width:5px;height:5px}.month{display:none}.navigator.month-mode .weekbar{display:none}.navigator.month-mode .month{display:block}.month-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--muted);padding-bottom:7px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.mday{min-height:50px;border:0;background:transparent;border-radius:11px;padding:5px 2px;cursor:pointer;color:var(--ink)}.mday.blank{pointer-events:none}.mday .num{font-size:12px}.mday.selected{background:var(--artist-soft)}.mday.today:not(.selected){box-shadow:inset 0 0 0 1.5px var(--artist)}.mday.past{opacity:.38}.mday.past.selected{opacity:1}.mday .marks{margin-top:5px}.hint{font-size:11px;color:var(--muted);margin:10px 2px 0}.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 2px 12px;margin-top:-2px}.filters::-webkit-scrollbar{display:none}.filterbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}.filterbtn.active{background:var(--ink);border-color:var(--ink);color:#fff}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-head h2{font-size:17px;margin:0}.count{font-size:11px;color:var(--muted)}
.day-section{margin-bottom:24px}.date-title{display:flex;align-items:baseline;gap:7px;margin:16px 2px 8px}.date-title b{font-size:18px}.date-title span{font-size:11px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px 15px;margin-bottom:8px}.card.artist{border-left:4px solid var(--artist)}.card.fan{border-left:4px solid var(--fan)}.row{display:flex;align-items:center;gap:7px}.type{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}.type.tag-music{background:var(--tag-music-bg);color:var(--tag-music-fg)}.type.tag-prerecord{background:var(--tag-prerec-bg);color:var(--tag-prerec-fg)}.type.tag-fansign{background:var(--tag-fansign-bg);color:var(--tag-fansign-fg)}.type.tag-show{background:var(--tag-performance-bg);color:var(--tag-performance-fg)}.type.tag-lucky{background:var(--tag-lucky-bg);color:var(--tag-lucky-fg)}.type.tag-merch{background:var(--tag-merch-bg);color:var(--tag-merch-fg)}.type.tag-ticket{background:var(--tag-ticket-bg);color:var(--tag-ticket-fg)}.time{margin-left:auto;font-size:12px;font-weight:700}h3{font-size:16px;margin:9px 0 5px;line-height:1.35}.sub{font-size:12px;line-height:1.55;color:var(--muted);margin:0}.official-link{display:inline-block;margin-top:10px;font-size:12px;color:var(--artist);text-decoration:none;border-bottom:1px solid #b7bea4;padding-bottom:1px}.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}
@media(max-width:520px){.wrap{padding:16px 10px 56px}header{padding:4px 2px 14px}h1{font-size:28px}.navigator{border-radius:18px;padding:12px 9px}.range{font-size:14px}.daybtn .num{width:28px;height:28px}.card{padding:13px 13px}.mday{min-height:45px}}
html, body, button, a { touch-action: manipulation; }
</style></head><body><div class="wrap">
<header><h1>AND2BLE Schedule</h1></header>
<section class="navigator" id="navigator"><div class="navtop"><button class="iconbtn" id="prevWeek">‹</button><div class="range" id="rangeText">11月1日 – 7日</div><div class="nav-actions"><button class="iconbtn" id="monthToggle">整月 ▦</button><button class="iconbtn" id="nextWeek">›</button></div></div><div class="weekbar" id="weekbar"></div><div class="month"><div class="month-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="month-grid" id="monthGrid"></div><p class="hint">点一个日期，回到那一周查看详细行程</p></div></section>
<div class="filters" id="filters"></div><div class="section-head"><h2 id="listTitle">本周行程</h2><span class="count" id="count"></span></div><main id="events"></main>
</div>
<script>
let events=[];
const dows=['周日','周一','周二','周三','周四','周五','周六'];
const filterTypes=['全部','打歌','预录','签售','演出','Lucky Draw','周边','票务'];
const now=new Date(); now.setHours(0,0,0,0);
let scheduleMonths=[];
let monthIndex=0,currentYear=now.getFullYear(),currentMonth=now.getMonth();
let todayInCurrent=null,weekStart=1,selectedDay=null,monthMode=false,activeFilter='全部';
function rebuildScheduleMonths(){const keys=[...new Set(events.map(e=>e.date.slice(0,7)))].sort();scheduleMonths=keys.map(k=>{const [y,m]=k.split('-').map(Number);return {y,m:m-1}});if(!scheduleMonths.length)scheduleMonths=[{y:now.getFullYear(),m:now.getMonth()}];let idx=scheduleMonths.findIndex(x=>x.y===now.getFullYear()&&x.m===now.getMonth());if(idx<0){idx=scheduleMonths.findIndex(x=>new Date(x.y,x.m,1)>=now);if(idx<0)idx=scheduleMonths.length-1;}monthIndex=idx;currentYear=scheduleMonths[idx].y;currentMonth=scheduleMonths[idx].m;syncToday();selectedDay=todayInCurrent;weekStart=todayInCurrent?1+Math.floor((todayInCurrent-1)/7)*7:1;}
function monthName(m){return ['January','February','March','April','May','June','July','August','September','October','November','December'][m]}
function daysInMonth(){return new Date(currentYear,currentMonth+1,0).getDate()}
function keyFor(d){return `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function isPast(d){const x=new Date(currentYear,currentMonth,d);x.setHours(0,0,0,0);return x<now}
function isToday(d){return now.getFullYear()===currentYear&&now.getMonth()===currentMonth&&now.getDate()===d}
function tagClass(type){const m={'打歌':'tag-music','预录':'tag-prerecord','签售':'tag-fansign','演出':'tag-show','Lucky Draw':'tag-lucky','周边':'tag-merch','票务':'tag-ticket'};return m[type]||'tag-default'}
function monthEvents(){const prefix=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-`;return events.filter(x=>x.date.startsWith(prefix))}
function marksFor(d){const e=events.filter(x=>x.date===keyFor(d)),a=e.some(x=>x.group==='artist'),f=e.some(x=>x.group==='fan');return `${a?'<i class="dot artist-dot"></i>':''}${f?'<i class="dot fan-dot"></i>':''}`}
function syncToday(){todayInCurrent=(now.getFullYear()===currentYear&&now.getMonth()===currentMonth)?now.getDate():null}
function renderWeek(){const wb=document.getElementById('weekbar');wb.innerHTML='';const max=daysInMonth();for(let i=0;i<7;i++){let d=weekStart+i;if(d>max)continue;let date=new Date(currentYear,currentMonth,d);let b=document.createElement('button');b.className='daybtn'+(selectedDay===d?' selected':'')+(isPast(d)?' past':'')+(isToday(d)?' today':'');b.innerHTML=`<span class="dow">${['SUN','MON','TUE','WED','THU','FRI','SAT'][date.getDay()]}</span><span class="num">${String(d).padStart(2,'0')}</span><span class="marks">${marksFor(d)}</span>`;b.onclick=()=>{selectedDay=selectedDay===d?null:d;renderAll()};wb.appendChild(b)}document.getElementById('rangeText').textContent=monthName(currentMonth)}
function renderMonth(){const g=document.getElementById('monthGrid');g.innerHTML='';for(let i=0;i<new Date(currentYear,currentMonth,1).getDay();i++){g.insertAdjacentHTML('beforeend','<button class="mday blank"></button>')}for(let d=1;d<=daysInMonth();d++){let b=document.createElement('button');b.className='mday'+(selectedDay===d?' selected':'')+(isPast(d)?' past':'')+(isToday(d)?' today':'');b.innerHTML=`<div class="num">${d}</div><div class="marks">${marksFor(d)}</div>`;b.onclick=()=>{selectedDay=d;weekStart=1+Math.floor((d-1)/7)*7;monthMode=false;renderAll();setTimeout(()=>document.getElementById('events').scrollIntoView({behavior:'smooth',block:'start'}),50)};g.appendChild(b)}}
function renderFilters(){const box=document.getElementById('filters');box.innerHTML=filterTypes.map(t=>`<button class="filterbtn ${activeFilter===t?'active':''}" data-type="${t}">${t}</button>`).join('');box.querySelectorAll('.filterbtn').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.type;renderAll()})}
function renderEvents(){let list=monthEvents().filter(e=>{const d=Number(e.date.slice(-2));return (selectedDay?d===selectedDay:d>=weekStart&&d<=weekStart+6)&&(activeFilter==='全部'||e.type===activeFilter)}).sort((a,b)=>a.date.localeCompare(b.date)||a.t.localeCompare(b.t));const main=document.getElementById('events');main.innerHTML='';document.getElementById('listTitle').textContent=selectedDay?`${currentMonth+1}月${selectedDay}日`:'本周行程';document.getElementById('count').textContent=`${list.length} 项`;if(!list.length){main.innerHTML='<div class="empty">这一天目前没有已确认行程</div>';return}let days=[...new Set(list.map(x=>Number(x.date.slice(-2))))];days.forEach(d=>{let sec=document.createElement('section');sec.className='day-section';let date=new Date(currentYear,currentMonth,d);sec.innerHTML=`<div class="date-title"><b>${String(currentMonth+1).padStart(2,'0')}/${String(d).padStart(2,'0')}</b><span>${dows[date.getDay()]}</span></div>`;list.filter(x=>Number(x.date.slice(-2))===d).forEach(e=>{sec.insertAdjacentHTML('beforeend',`<article class="card ${e.group}"><div class="row"><span class="type ${tagClass(e.type)}">${e.type}</span>${e.t?`<span class="time">${e.t}${e.zone?` ${e.zone}`:''}</span>`:''}</div><h3>${e.title}</h3>${e.sub?`<p class="sub">${e.sub}</p>`:''}${e.url?`<a class="official-link" href="${e.url}" target="_blank" rel="noopener">Official Link ↗</a>`:''}</article>`)});main.appendChild(sec)})}
function setMonth(index,goToEnd=false){monthIndex=Math.max(0,Math.min(scheduleMonths.length-1,index));currentYear=scheduleMonths[monthIndex].y;currentMonth=scheduleMonths[monthIndex].m;syncToday();selectedDay=todayInCurrent;weekStart=todayInCurrent?1+Math.floor((todayInCurrent-1)/7)*7:(goToEnd?1+Math.floor((daysInMonth()-1)/7)*7:1)}
function renderAll(){document.getElementById('navigator').classList.toggle('month-mode',monthMode);document.getElementById('monthToggle').classList.toggle('active',monthMode);document.getElementById('monthToggle').textContent=monthMode?'本周 ≡':'整月 ▦';document.getElementById('listTitle').parentElement.classList.toggle('hidden',monthMode);document.getElementById('events').classList.toggle('hidden',monthMode);document.getElementById('filters').classList.toggle('hidden',monthMode);renderWeek();renderMonth();renderFilters();renderEvents()}
document.getElementById('monthToggle').onclick=()=>{monthMode=!monthMode;renderAll()};
document.getElementById('prevWeek').onclick=()=>{if(weekStart>1){weekStart=Math.max(1,weekStart-7);selectedDay=null}else if(monthIndex>0){setMonth(monthIndex-1,true);selectedDay=null}renderAll()};
document.getElementById('nextWeek').onclick=()=>{if(weekStart+7<=daysInMonth()){weekStart+=7;selectedDay=null}else if(monthIndex<scheduleMonths.length-1){setMonth(monthIndex+1,false);selectedDay=null}renderAll()};
async function loadSchedule(){try{const res=await fetch(`schedule.json?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();events=Array.isArray(data)?data:(data.events||[]);rebuildScheduleMonths();renderAll();}catch(err){console.error('Failed to load schedule.json',err);document.getElementById('events').innerHTML='<div class="empty">行程数据暂时加载失败，请刷新页面重试</div>';}}
loadSchedule();
</script></body></html>
